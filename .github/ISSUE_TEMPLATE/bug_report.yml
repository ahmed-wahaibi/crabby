name: Bug report
description: Something in Crabby does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including the exact error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command, and the smallest task or folder that shows the problem.
      placeholder: |
        1. cd into an empty folder
        2. crabby run sc-rust-engineer "..."
        3. ...
    validations:
      required: true
  - type: input
    id: exit-code
    attributes:
      label: Exit code
      description: Run `echo $?` (or `echo $LASTEXITCODE` in PowerShell) right after the command.
  - type: input
    id: crabby-version
    attributes:
      label: Crabby version
      description: Output of `crabby --version`, or the commit you built from.
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and terminal
      placeholder: Windows 11, Windows Terminal
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste what Crabby printed. Remove anything private, such as file contents, keys or tokens.
      render: text
