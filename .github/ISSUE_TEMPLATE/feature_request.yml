name: Feature request
description: Propose a new capability or a change to an existing one
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why Crabby does not let you do it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What Crabby should do, from the user's side. Commands and example output help.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable statements that are true when this is done.
      placeholder: |
        - [ ] `crabby ...` prints ...
        - [ ] exit code is ... when ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this request deliberately does not include.
  - type: textarea
    id: token-cost
    attributes:
      label: Token cost
      description: Does this add a model call or make a prompt longer? Roughly how much per run?
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I looked at FEATURES.md and this is not already listed as planned
        - label: This is about Crabby itself, not the instructions of a single agent (those belong in sc-agents)
