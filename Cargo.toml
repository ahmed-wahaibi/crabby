[package]
name = "crabby"
version = "0.1.0"
edition = "2021"
# The code itself needs 1.82 (`Option::is_none_or`); the locked clap 4.6 needs 1.85.
rust-version = "1.85"
description = "AI agent orchestrator for Claude Code: picks the right specialist agents for a task and runs them from your terminal"
license = "MIT"
repository = "https://github.com/ahmed-wahaibi/crabby"
readme = "README.md"
keywords = ["claude", "ai-agents", "orchestrator", "cli", "llm"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
serde_json = "1"
terminal_size = "0.4.4"
